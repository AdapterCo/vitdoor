map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

include /etc/nginx/cloudflare-realip.conf;
include /etc/nginx/cloudflare-origin-only.conf;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl default_server;
    server_name _;
    include /etc/nginx/tls.conf;
    return 444;
}

server {
    listen 80;
    listen 443 ssl;
    server_name app.vitdoor.com.br vitdoor.com.br www.vitdoor.com.br;
    include /etc/nginx/tls.conf;
    include /etc/nginx/security-headers.conf;
    if ($cloudflare_origin = 0) { return 444; }
    if ($scheme = http) { return 301 https://$host$request_uri; }
    client_max_body_size 256m;
    add_header X-VitDoor-Frontend "admin-panel" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;
    set $frontend_upstream http://admin:80;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /r/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

