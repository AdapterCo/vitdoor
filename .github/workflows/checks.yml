name: Checks
on: [push, pull_request]
jobs:
  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, admin, player]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'backend'
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - if: matrix.app == 'admin'
        run: npm --prefix ../player ci
      - if: matrix.app == 'admin'
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vitdoor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d vitdoor_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/vitdoor_test
      JWT_SECRET: ci-device-secret-only-never-use-in-production
      ADMIN_JWT_SECRET: ci-admin-secret-only-never-use-in-production
      INITIAL_ADMIN_EMAIL: ci@example.invalid
      INITIAL_ADMIN_PASSWORD: ci-test-password-123456
      ADMIN_EMAIL: ci@example.invalid
      ADMIN_PASSWORD: ci-test-password-123456
      STORAGE_DRIVER: local
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed-admin
      - name: Start isolated API and check tenant isolation
        run: |
          node dist/server.js > api-test.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run audit:isolation
